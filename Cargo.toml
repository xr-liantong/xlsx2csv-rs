[package]
name = "xlsx2csv-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.100.0"
license = "MIT"
description = "Rust port of xlsx2csv 0.8.6 (CLI subset): byte-identical CSV output"
repository = "https://github.com/xr-liantong/xlsx2csv-rs"

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
lexical-core = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "xlsx2csv-rs"
path = "src/bin/main.rs"

[[bench]]
name = "speed"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
